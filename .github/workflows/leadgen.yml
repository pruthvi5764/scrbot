name: CCTV Lead Generation & Outreach Engine

on:
  # Allows triggering manually anytime from GitHub Web UI or Mobile App
  workflow_dispatch:
    inputs:
      target:
        description: "Target number of leads to discover"
        required: true
        default: "50"
      pitch_top:
        description: "Number of top prospects to draft outreach pitches for"
        required: true
        default: "25"
      cities:
        description: "Comma-separated cities (e.g. 'Bengaluru,Mumbai') or leave blank for all"
        required: false
        default: ""
      resume:
        description: "Append to existing leads (resume)"
        type: boolean
        default: true
      dispatch_outreach:
        description: "Auto-dispatch outreach (WhatsApp & Email)"
        type: boolean
        default: true

  # Automatic daily schedule at 9:30 AM IST (4:00 AM UTC)
  schedule:
    - cron: "0 4 * * *"

jobs:
  run-lead-generator:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated leads.csv back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest test_cctv_leadgen.py

      - name: Run Lead Discovery, Audit & Pitch Engine (Non-AI Fast Pipeline)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER || '+919353489736' }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'Atrya Solutions' }}
        run: |
          TARGET="${{ github.event.inputs.target || '50' }}"
          PITCH_TOP="${{ github.event.inputs.pitch_top || '25' }}"
          CITIES="${{ github.event.inputs.cities || '' }}"
          RESUME="${{ github.event.inputs.resume || 'true' }}"

          ARGS=("--target" "$TARGET" "--pitch-top" "$PITCH_TOP")

          if [ -n "$CITIES" ]; then
            ARGS+=("--cities" "$CITIES")
          fi

          if [ "$RESUME" != "false" ]; then
            ARGS+=("--resume")
          fi

          echo "[*] Executing: python cctv_leadgen.py ${ARGS[*]}"
          python cctv_leadgen.py "${ARGS[@]}"

      - name: Automated Outreach Dispatch (WhatsApp & Email)
        if: ${{ github.event.inputs.dispatch_outreach != 'false' }}
        env:
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER || '+919353489736' }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'Atrya Solutions' }}
          WHATSAPP_GATEWAY_URL: ${{ secrets.WHATSAPP_GATEWAY_URL }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          ULTRAMSG_INSTANCE_ID: ${{ secrets.ULTRAMSG_INSTANCE_ID }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "[*] Executing Automated Outreach Dispatcher..."
          python dispatch_outreach.py --channel both --limit 25 || true

      - name: Upload Output Spreadsheets as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cctv-leads-${{ github.run_number }}
          path: |
            leads.csv
            leads.xlsx
            leads_dashboard.html
            company_details.json
          retention-days: 30

      - name: Commit & Push Updated Leads to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leads.csv leads.xlsx leads_dashboard.html company_details.json || true
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-update leads.csv, leads.xlsx & dashboard [skip ci]"
            git push
          fi
